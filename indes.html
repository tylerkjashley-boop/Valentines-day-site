<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Be My Valentine?</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      height: 100vh;
      display: grid;
      place-items: center;
      background: #fff5f7;
    }
    .card {
      width: min(520px, 92vw);
      background: white;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      text-align: center;
    }
    h1 { margin: 0 0 16px; font-size: 28px; }
    p { margin: 0 0 20px; color: #444; }

    .buttons {
      position: relative;
      height: 90px;
      display: grid;
      place-items: center;
      gap: 14px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 22px;
      cursor: pointer;
      font-weight: 700;
      transition: transform .12s ease, box-shadow .12s ease;
      box-shadow: 0 8px 18px rgba(0,0,0,.12);
    }
    button:active { transform: scale(.98); }

    #yesBtn {
      background: #ff2d55;
      color: white;
      font-size: 18px; /* will grow */
    }

    #noBtn {
      background: #e9e9ef;
      color: #111;
      position: absolute; /* lets us move it */
      right: 18%;
      top: 18px;
    }

    .success {
      display: none;
      margin-top: 18px;
      font-size: 18px;
      color: #0b7a3c;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Will you be my Valentine? 💘</h1>
    <p>Choose wisely…</p>

    <div class="buttons">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </div>

    <div class="success" id="successMsg">Yayyy! 💞 See you Valentine’s Day!</div>
  </div>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const successMsg = document.getElementById("successMsg");
    const buttonsBox = document.querySelector(".buttons");

    let noClicks = 0;

    // helper: move "No" somewhere random inside the buttons container
    function moveNoButton() {
      const boxRect = buttonsBox.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      // keep it within bounds
      const maxX = boxRect.width - btnRect.width;
      const maxY = boxRect.height - btnRect.height;

      const x = Math.random() * Math.max(0, maxX);
      const y = Math.random() * Math.max(0, maxY);

      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
      noBtn.style.right = "auto";
    }

    noBtn.addEventListener("click", () => {
      noClicks++;

      // Make YES bigger each time NO is clicked
      const scale = 1 + noClicks * 0.18; // adjust growth speed
      yesBtn.style.transform = `scale(${scale})`;

      // Optional: move NO around to make it harder to click
      moveNoButton();

      // Optional: change No text after many clicks
      if (noClicks === 3) noBtn.textContent = "Sure?";
      if (noClicks === 6) noBtn.textContent = "Really?";
      if (noClicks === 9) noBtn.textContent = "Last chance…";
    });

    yesBtn.addEventListener("click", () => {
      successMsg.style.display = "block";
      yesBtn.textContent = "Yesss!!! 💖";
      noBtn.style.display = "none";
    });

    // set initial random-ish position if you want
    moveNoButton();
  </script>
</body>
</html>
