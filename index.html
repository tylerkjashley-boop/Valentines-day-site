<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Be My Valentine? 💘</title>
  <style>
    :root{
      --bg1:#ffe6ee;
      --bg2:#fff7d6;
      --card:#ffffffcc;
      --text:#1a1a1a;
      --muted:#555;
      --yes:#ff2d55;
      --yes2:#ff6a88;
      --no:#f1f2f6;
      --shadow: 0 18px 50px rgba(0,0,0,.14);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 800px at 20% 15%, var(--bg2), transparent 60%),
        radial-gradient(900px 600px at 80% 20%, #e6f6ff, transparent 55%),
        linear-gradient(135deg, var(--bg1), #f7f7ff);
      display:grid;
      place-items:center;
      padding:18px;
      overflow:hidden;
    }

    /* floating hearts background */
    .heart{
      position:fixed;
      width:18px; height:18px;
      opacity:.25;
      animation: floatUp linear infinite;
      filter: blur(.2px);
      pointer-events:none;
    }
    @keyframes floatUp{
      from{ transform: translateY(110vh) rotate(0deg); }
      to  { transform: translateY(-20vh) rotate(360deg); }
    }

    .wrap{
      width:min(680px, 96vw);
      display:grid;
      grid-template-columns: 1fr;
      gap:14px;
      z-index:2;
    }

    .card{
      background:var(--card);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 26px;
      box-shadow: var(--shadow);
      padding: 22px 22px 18px;
    }

    .top{
      display:flex;
      align-items:center;
      gap:16px;
    }

    .mascot{
      width:110px;
      flex: 0 0 auto;
      filter: drop-shadow(0 12px 18px rgba(0,0,0,.12));
      transform: rotate(-2deg);
    }

    h1{
      margin:0;
      font-size: clamp(22px, 3.2vw, 32px);
      line-height:1.1;
    }
    .subtitle{
      margin-top:8px;
      color:var(--muted);
      font-size: clamp(14px, 2.2vw, 16px);
    }

    .buttonsArea{
      margin-top:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;
      position:relative;
      height: 98px;
    }

    button{
      border:0;
      border-radius: 999px;
      padding: 12px 22px;
      font-weight: 800;
      cursor:pointer;
      transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
      box-shadow: 0 10px 22px rgba(0,0,0,.13);
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    button:active{ transform: scale(.98); }

    #yesBtn{
      background: linear-gradient(135deg, var(--yes), var(--yes2));
      color:white;
      font-size: 18px; /* grows */
      letter-spacing:.2px;
    }
    #yesBtn:hover{ filter: brightness(1.03); }

    #noBtn{
      background: var(--no);
      color: #111;
      position:absolute; /* lets us move it */
      right: 18%;
      top: 18px;
      font-weight: 800;
    }
    #noBtn:hover{ filter: brightness(.98); }

    .hint{
      text-align:center;
      margin-top: 10px;
      font-size: 13px;
      color:#666;
    }

    .result{
      display:none;
      text-align:center;
      margin-top: 16px;
      font-size: 18px;
      font-weight: 800;
      color:#0b7a3c;
    }

    /* confetti canvas */
    canvas#confetti{
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:1;
    }

    @media (max-width:520px){
      .top{ flex-direction:column; text-align:center; }
      .mascot{ width:96px; }
      .buttonsArea{ height: 112px; }
    }
  </style>
</head>
<body>
  <canvas id="confetti"></canvas>

  <!-- floating hearts -->
  <script>
    (function spawnHearts(){
      const colors = ["#ff2d55","#ff6a88","#ffcc00","#6dd5ff","#9b8cff"];
      for(let i=0;i<18;i++){
        const h = document.createElement("div");
        h.className = "heart";
        const size = 10 + Math.random()*16;
        h.style.width = h.style.height = `${size}px`;
        h.style.left = `${Math.random()*100}vw`;
        h.style.animationDuration = `${10 + Math.random()*10}s`;
        h.style.animationDelay = `${Math.random()*-20}s`;
        h.innerHTML = `<svg viewBox="0 0 24 24" fill="${colors[i%colors.length]}" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 21s-7.2-4.6-9.6-9C.3 7.3 3 4 6.8 4c1.9 0 3.5 1 4.4 2.2C12.1 5 13.7 4 15.6 4 19.4 4 22.1 7.3 21.6 12c-2.4 4.4-9.6 9-9.6 9z"/>
        </svg>`;
        document.body.appendChild(h);
      }
    })();
  </script>

  <div class="wrap">
    <div class="card">
      <div class="top">
        <!-- Original mascot (NOT a Minion) -->
        <svg class="mascot" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg" aria-label="Cute mascot">
          <defs>
            <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#FFD84D"/>
              <stop offset="1" stop-color="#FFB703"/>
            </linearGradient>
          </defs>
          <!-- body -->
          <rect x="55" y="22" width="110" height="160" rx="52" fill="url(#g1)"/>
          <!-- overalls -->
          <path d="M62 118c16 18 34 25 48 25s32-7 48-25v64H62z" fill="#3B82F6" opacity=".95"/>
          <circle cx="82" cy="130" r="10" fill="#2563EB"/>
          <circle cx="138" cy="130" r="10" fill="#2563EB"/>
          <!-- goggles -->
          <circle cx="110" cy="82" r="44" fill="#111" opacity=".1"/>
          <circle cx="86" cy="82" r="28" fill="#E5E7EB" stroke="#111" stroke-width="6"/>
          <circle cx="134" cy="82" r="28" fill="#E5E7EB" stroke="#111" stroke-width="6"/>
          <rect x="108" y="72" width="4" height="20" fill="#111"/>
          <circle cx="86" cy="82" r="12" fill="#111"/>
          <circle cx="134" cy="82" r="12" fill="#111"/>
          <circle cx="82" cy="78" r="4" fill="#fff"/>
          <circle cx="130" cy="78" r="4" fill="#fff"/>
          <!-- blush -->
          <circle cx="70" cy="102" r="8" fill="#FF6A88" opacity=".55"/>
          <circle cx="150" cy="102" r="8" fill="#FF6A88" opacity=".55"/>
          <!-- mouth -->
          <path d="M96 112c6 10 22 10 28 0" stroke="#111" stroke-width="6" stroke-linecap="round" fill="none"/>
          <!-- tiny heart -->
          <path d="M110 30c6-8 18-2 14 8-4 10-14 16-14 16s-10-6-14-16c-4-10 8-16 14-8z"
                fill="#ff2d55" opacity=".9"/>
        </svg>

        <div>
          <h1 id="title">Will you be my Valentine? 💘</h1>
          <div class="subtitle" id="subtitle">
            I made this page just for you. Be honest… but choose wisely 😭
          </div>
        </div>
      </div>

      <div class="buttonsArea" id="buttonsArea">
        <button id="yesBtn">Yes</button>
        <button id="noBtn" aria-label="No button">No</button>
      </div>

      <div class="hint" id="hint">Tip: the “No” button runs away. A lot.</div>
      <div class="result" id="result">Yesss!! 💞 You just made my day.</div>
    </div>
  </div>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const buttonsArea = document.getElementById("buttonsArea");
    const result = document.getElementById("result");
    const hint = document.getElementById("hint");
    const title = document.getElementById("title");
    const subtitle = document.getElementById("subtitle");

    let noClicks = 0;

    // Escalating phrases (includes "okay fine..." but it still dodges)
    const noPhrases = [
      "No",
      "Are you sure?",
      "Be serious...",
      "Please don't 😭",
      "You playing too much",
      "Bro stop",
      "This is getting awkward",
      "okay fine...",
      "WAIT WAIT WAIT",
      "I regret everything",
      "Nah you not catching me 💀"
    ];

    function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }

    function moveNoButton() {
      const boxRect = buttonsArea.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      const maxX = boxRect.width - btnRect.width;
      const maxY = boxRect.height - btnRect.height;

      const x = Math.random() * Math.max(0, maxX);
      const y = Math.random() * Math.max(0, maxY);

      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
      noBtn.style.right = "auto";
    }

    // Runs away on hover
    noBtn.addEventListener("mouseenter", () => {
      moveNoButton();
    });

    // Runs away on click (and makes Yes bigger)
    noBtn.addEventListener("click", () => {
      noClicks++;

      const scale = clamp(1 + noClicks * 0.25, 1, 3.4);
      yesBtn.style.transform = `scale(${scale})`;

      noBtn.textContent = noPhrases[Math.min(noClicks, noPhrases.length - 1)];

      if (noBtn.textContent === "okay fine...") {
        hint.textContent = "You thought it would stop? 😭";
      }

      moveNoButton();
    });

    yesBtn.addEventListener("click", () => {
      title.textContent = "W Valentine secured 💞";
      subtitle.textContent = "Screenshot this. You said YES. It’s official.";
      result.style.display = "block";
      yesBtn.textContent = "Yesss!!! 💖";
      noBtn.style.display = "none";
      hint.style.display = "none";
      fireConfetti();
    });

    // Confetti (simple, no libraries)
    const canvas = document.getElementById("confetti");
    const ctx = canvas.getContext("2d");
    let confettiPieces = [];
    let confettiRunning = false;

    function resizeCanvas(){
      canvas.width = window.innerWidth * devicePixelRatio;
      canvas.height = window.innerHeight * devicePixelRatio;
      ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    function fireConfetti(){
      confettiPieces = [];
      const colors = ["#ff2d55","#ff6a88","#ffd84d","#3b82f6","#6dd5ff","#a855f7"];
      for(let i=0;i<180;i++){
        confettiPieces.push({
          x: Math.random()*window.innerWidth,
          y: -20 - Math.random()*window.innerHeight*0.3,
          r: 3 + Math.random()*5,
          vx: -3 + Math.random()*6,
          vy: 2 + Math.random()*5,
          rot: Math.random()*Math.PI,
          vr: -0.2 + Math.random()*0.4,
          c: colors[i%colors.length],
          life: 240 + Math.random()*120
        });
      }
      confettiRunning = true;
      requestAnimationFrame(tickConfetti);
      setTimeout(()=> confettiRunning=false, 2500);
    }

    function tickConfetti(){
      if(!confettiRunning && confettiPieces.length === 0) return;
      ctx.clearRect(0,0,window.innerWidth, window.innerHeight);

      confettiPieces = confettiPieces.filter(p => p.life > 0);
      for(const p of confettiPieces){
        p.life -= 1;
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.03;
        p.rot += p.vr;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.c;
        ctx.fillRect(-p.r, -p.r, p.r*2.2, p.r*0.9);
        ctx.restore();
      }
      requestAnimationFrame(tickConfetti);
    }

    // initial placement
    moveNoButton();
  </script>
</body>
</html>
