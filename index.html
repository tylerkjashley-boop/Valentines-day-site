<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Be My Valentine? 💘</title>
  <style>
    :root{
      --bg1:#fff1f6;
      --bg2:#ffe7f0;
      --card:#ffffff;
      --ink:#1f1f2b;
      --muted:#5b5b73;
      --pink:#ff2d55;
      --pink2:#ff5c8a;
      --soft:#f3f3fb;
      --shadow: 0 18px 45px rgba(25, 15, 30, .10);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:
        radial-gradient(1100px 700px at 20% 20%, var(--bg2), transparent 70%),
        radial-gradient(900px 600px at 80% 0%, #ffeef6, transparent 60%),
        linear-gradient(180deg, var(--bg1), #ffffff);
      color:var(--ink);
      overflow:hidden;
    }

    /* floating hearts background */
    .float-hearts{
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.25;
      filter: blur(.2px);
    }
    .float-hearts span{
      position:absolute;
      font-size: clamp(14px, 2vw, 22px);
      animation: drift 12s linear infinite;
      transform: translateY(110vh);
    }
    @keyframes drift{
      0% { transform: translateY(110vh) translateX(0) rotate(0deg); opacity:0; }
      10%{ opacity:.9; }
      90%{ opacity:.9; }
      100%{ transform: translateY(-15vh) translateX(60px) rotate(25deg); opacity:0; }
    }

    .wrap{
      width:min(720px, 92vw);
      padding: 18px;
      position:relative;
      z-index:2;
    }

    .card{
      background: rgba(255,255,255,.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,45,85,.10);
      border-radius: 24px;
      padding: 26px;
      box-shadow: var(--shadow);
    }

    .top{
      display:flex;
      align-items:center;
      gap:18px;
      justify-content:center;
      flex-wrap:wrap;
      margin-bottom: 10px;
    }

    /* Cute mascot */
    .mascot{
      width: 90px;
      height: 90px;
      border-radius: 28px;
      background: linear-gradient(180deg, #ffd3df, #fff);
      position:relative;
      box-shadow: 0 16px 30px rgba(255,45,85,.18);
      animation: bob 2.2s ease-in-out infinite;
    }
    @keyframes bob{
      0%,100%{ transform: translateY(0); }
      50%{ transform: translateY(-6px); }
    }
    .mascot::before, .mascot::after{
      content:"";
      position:absolute;
      top: 34px;
      width: 10px;
      height: 14px;
      border-radius: 8px;
      background: #1f1f2b;
      opacity:.85;
    }
    .mascot::before{ left: 28px; }
    .mascot::after{ right: 28px; }

    .mouth{
      position:absolute;
      left:50%;
      top: 56px;
      transform: translateX(-50%);
      width: 20px;
      height: 12px;
      border-radius: 0 0 12px 12px;
      background:#1f1f2b;
      opacity:.85;
    }
    .blush{
      position:absolute;
      top: 50px;
      width: 16px;
      height: 10px;
      border-radius: 999px;
      background: rgba(255,45,85,.35);
      filter: blur(.2px);
    }
    .blush.left{ left: 18px; }
    .blush.right{ right: 18px; }

    .mini-hearts{
      position:absolute;
      inset:0;
      pointer-events:none;
    }
    .mini-hearts span{
      position:absolute;
      font-size:16px;
      animation: pop 1.6s ease-in-out infinite;
      opacity:.85;
    }
    .mini-hearts span:nth-child(1){ left: 8px; top:-6px; animation-delay:.0s;}
    .mini-hearts span:nth-child(2){ right: 10px; top: 4px; animation-delay:.4s;}
    .mini-hearts span:nth-child(3){ left: 50%; top:-12px; transform:translateX(-50%); animation-delay:.8s;}
    @keyframes pop{
      0%,100%{ transform: translateY(0) scale(1); opacity:.6; }
      50%{ transform: translateY(-6px) scale(1.08); opacity:1; }
    }

    h1{
      margin:0;
      font-size: clamp(24px, 3.1vw, 34px);
      letter-spacing: -0.4px;
    }
    .sub{
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height:1.35;
    }

    .stage{
      margin-top: 18px;
      background: linear-gradient(180deg, rgba(255,45,85,.06), rgba(255,255,255,.6));
      border: 1px solid rgba(255,45,85,.10);
      border-radius: 20px;
      padding: 18px;
      position:relative;
      overflow:hidden;
      min-height: 170px;
    }

    .prompt{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      margin: 6px 0 14px;
      font-weight: 750;
      font-size: 18px;
    }
    .prompt .tag{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,45,85,.10);
      color: #b11533;
      font-weight: 800;
      font-size: 13px;
    }

    .buttons{
      position: relative;
      height: 110px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap: 16px;
    }

    button{
      border: 0;
      border-radius: 999px;
      padding: 12px 22px;
      cursor: pointer;
      font-weight: 800;
      transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
      box-shadow: 0 14px 28px rgba(0,0,0,.12);
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    button:active{ transform: scale(.98); }

    #yesBtn{
      background: linear-gradient(135deg, var(--pink), var(--pink2));
      color: white;
      font-size: 18px; /* grows via scale */
      position: relative;
    }
    #yesBtn::after{
      content:"";
      position:absolute;
      inset:-10px;
      border-radius:999px;
      background: rgba(255,45,85,.16);
      z-index:-1;
      filter: blur(12px);
      opacity:.0;
      transition: opacity .2s ease;
    }
    #yesBtn:hover::after{ opacity:.9; }

    #noBtn{
      background: #f0f0f6;
      color: #1f1f2b;
      position: absolute;
      left: 58%;
      top: 34px;
      border: 1px solid rgba(0,0,0,.08);
    }

    /* when user keeps clicking no, it wiggles */
    .wiggle{
      animation: wiggle .22s ease-in-out 1;
    }
    @keyframes wiggle{
      0%{ transform: translate(0,0) rotate(0deg); }
      25%{ transform: translate(-3px,1px) rotate(-2deg); }
      50%{ transform: translate(3px,-1px) rotate(2deg); }
      100%{ transform: translate(0,0) rotate(0deg); }
    }

    .footer{
      margin-top: 14px;
      display:flex;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      color: var(--muted);
      font-size: 13px;
    }
    .meter{
      display:flex;
      align-items:center;
      gap:8px;
    }
    .bar{
      width: 130px;
      height: 10px;
      border-radius:999px;
      background: rgba(0,0,0,.06);
      overflow:hidden;
    }
    .bar > i{
      display:block;
      height:100%;
      width: 0%;
      background: linear-gradient(90deg, rgba(255,45,85,.55), rgba(255,45,85,.95));
      border-radius:999px;
      transition: width .2s ease;
    }

    /* success overlay */
    .success{
      display:none;
      margin-top: 14px;
      padding: 14px 14px;
      border-radius: 16px;
      background: rgba(13, 180, 100, .10);
      border: 1px solid rgba(13, 180, 100, .20);
      color:#0b7a3c;
      font-weight: 800;
      text-align:center;
    }

    /* confetti hearts */
    .confetti{
      position:absolute;
      inset:0;
      pointer-events:none;
      overflow:hidden;
    }
    .confetti span{
      position:absolute;
      font-size: 18px;
      animation: confetti 1.2s ease-out forwards;
      opacity:0;
    }
    @keyframes confetti{
      0%{ transform: translateY(20px) scale(.8); opacity:0; }
      10%{ opacity:1; }
      100%{ transform: translateY(-180px) translateX(var(--dx)) rotate(25deg) scale(1.05); opacity:0; }
    }
  </style>
</head>
<body>

  <!-- floating hearts background -->
  <div class="float-hearts" aria-hidden="true" id="bgHearts"></div>

  <div class="wrap">
    <div class="card">
      <div class="top">
        <div class="mascot" aria-hidden="true">
          <div class="mini-hearts">
            <span>💗</span><span>💞</span><span>💘</span>
          </div>
          <div class="blush left"></div>
          <div class="blush right"></div>
          <div class="mouth"></div>
        </div>
        <div>
          <h1>Will you be my Valentine? 💘</h1>
          <p class="sub">Be honest… but also my little mascot gets sad when you click <b>No</b>.</p>
        </div>
      </div>

      <div class="stage">
        <div class="confetti" id="confetti"></div>

        <div class="prompt">
          <span class="tag">Important</span>
          <span id="promptText">Choose wisely 😇</span>
        </div>

        <div class="buttons" id="buttonsBox">
          <button id="yesBtn">Yes 💖</button>
          <button id="noBtn">No 😭</button>
        </div>

        <div class="success" id="successMsg">
          YESSIRRR 💞💞 Valentine secured. Screenshot this and send it to me 😤
        </div>

        <div class="footer">
          <div class="meter">
            <span>Charm Level:</span>
            <div class="bar"><i id="barFill"></i></div>
          </div>
          <div id="stats">No clicks: 0</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const successMsg = document.getElementById("successMsg");
    const buttonsBox = document.getElementById("buttonsBox");
    const promptText = document.getElementById("promptText");
    const stats = document.getElementById("stats");
    const barFill = document.getElementById("barFill");
    const confetti = document.getElementById("confetti");
    const bgHearts = document.getElementById("bgHearts");

    let noClicks = 0;

    // Background floating hearts
    (function makeBgHearts(){
      const hearts = ["💗","💞","💘","💕","💖"];
      for(let i=0;i<22;i++){
        const s = document.createElement("span");
        s.textContent = hearts[Math.floor(Math.random()*hearts.length)];
        s.style.left = Math.random()*100 + "vw";
        s.style.animationDelay = (Math.random()*10) + "s";
        s.style.animationDuration = (9 + Math.random()*8) + "s";
        bgHearts.appendChild(s);
      }
    })();

    function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }

    function moveNoButton(){
      const boxRect = buttonsBox.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      // bounds for positioning inside container
      const maxX = boxRect.width - btnRect.width;
      const maxY = boxRect.height - btnRect.height;

      // random spot
      const x = Math.random() * Math.max(0, maxX);
      const y = Math.random() * Math.max(0, maxY);

      noBtn.style.left = `${x}px`;
      noBtn.style.top  = `${y}px`;
    }

    function setCharmMeter(){
      // 0 clicks => 10%, 10+ clicks => 100%
      const pct = clamp(10 + noClicks*9, 10, 100);
      barFill.style.width = pct + "%";
    }

    const noPhrases = [
      "C’mon now… 😭",
      "You sure about that? 🤨",
      "My heart just skipped… 💔",
      "That button lookin kinda… small 😈",
      "I’m gonna keep asking 😤",
      "Don’t do me like this 😭",
      "No is not an option fr 😌",
      "Ok… now you’re playing 😐",
      "I’m telling Cupid 🏹",
      "Last chance… (not really) 😅"
    ];

    noBtn.addEventListener("click", () => {
      noClicks++;

      // make YES bigger each time NO is clicked
      const scale = 1 + noClicks * 0.16; // adjust growth speed
      yesBtn.style.transform = `scale(${scale})`;

      // make NO wiggle + move
      noBtn.classList.remove("wiggle");
      void noBtn.offsetWidth; // restart animation
      noBtn.classList.add("wiggle");
      moveNoButton();

      // update UI text
      promptText.textContent = noPhrases[Math.min(noClicks-1, noPhrases.length-1)];
      stats.textContent = `No clicks: ${noClicks}`;
      setCharmMeter();

      // change the NO label to get funnier
      if (noClicks === 3) noBtn.textContent = "No (kinda) 😬";
      if (noClicks === 6) noBtn.textContent = "No (pls stop) 😭";
      if (noClicks === 9) noBtn.textContent = "Okay fine… No 🙃";
      if (noClicks >= 12) noBtn.textContent = "I’m scared 😳";
    });

    yesBtn.addEventListener("click", () => {
      successMsg.style.display = "block";
      yesBtn.textContent = "YESS!!! 💘";
      noBtn.style.display = "none";
      promptText.textContent = "W decision 😤💞";

      // heart confetti burst
      const hearts = ["💗","💞","💘","💕","💖","😍"];
      for(let i=0;i<20;i++){
        const s = document.createElement("span");
        s.textContent = hearts[Math.floor(Math.random()*hearts.length)];
        s.style.left = (50 + (Math.random()*40 - 20)) + "%";
        s.style.top = (65 + Math.random()*10) + "%";
        s.style.setProperty("--dx", (Math.random()*220 - 110) + "px");
        s.style.animationDelay = (Math.random()*0.12) + "s";
        confetti.appendChild(s);
        setTimeout(() => s.remove(), 1300);
      }
    });

    // initial position
    moveNoButton();
    setCharmMeter();
  </script>
</body>
</html>
