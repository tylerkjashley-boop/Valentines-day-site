<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine? 💘</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ffe6ee, #fff6d6);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
}

.card {
    background: white;
    width: 420px;
    padding: 30px;
    border-radius: 30px;
    text-align: center;
    box-shadow: 0 25px 60px rgba(0,0,0,.15);
    position: relative;
}

h1 {
    margin: 0;
    font-size: 24px;
}

.subtitle {
    margin-top: 8px;
    color: #555;
}

.mascot {
    width: 120px;
    margin: 15px auto;
}

.buttons {
    margin-top: 20px;
    height: 120px;
    position: relative;
}

button {
    border: none;
    padding: 14px 24px;
    border-radius: 50px;
    font-weight: bold;
    cursor: pointer;
    transition: .15s ease;
    position: absolute;
}

#yesBtn {
    background: linear-gradient(135deg, #ff2d55, #ff6a88);
    color: white;
    left: 25%;
    top: 40px;
}

#noBtn {
    background: #e5e5e5;
    left: 55%;
    top: 40px;
}

#result {
    margin-top: 15px;
    font-weight: bold;
    display: none;
    color: green;
}

.shake {
    animation: shake .3s;
}

@keyframes shake {
    0% { transform: translateX(0px); }
    25% { transform: translateX(-5px); }
    50% { transform: translateX(5px); }
    75% { transform: translateX(-5px); }
    100% { transform: translateX(0px); }
}
</style>
</head>

<body>

<div class="card" id="card">

<!-- ORIGINAL YELLOW CHAOTIC MASCOT -->
<img class="mascot" src="minion.png">
<ellipse cx="100" cy="100" rx="60" ry="80" fill="#FFD84D"/>
<circle cx="80" cy="90" r="20" fill="white"/>
<circle cx="120" cy="90" r="20" fill="white"/>
<circle cx="80" cy="90" r="10"/>
<circle cx="120" cy="90" r="10"/>
<circle cx="75" cy="85" r="3" fill="white"/>
<circle cx="115" cy="85" r="3" fill="white"/>
<ellipse cx="100" cy="125" rx="25" ry="10" fill="#ff6a88"/>
</svg>

<h1 id="title">Will you be my Valentine? 💘</h1>
<div class="subtitle" id="subtitle">Be honest... but choose wisely 😭</div>

<div class="buttons">
    <button id="yesBtn">Yes</button>
    <button id="noBtn">No</button>
</div>

<div id="result">W Valentine Secured 💞</div>

</div>

<script>

const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const card = document.getElementById("card");
const result = document.getElementById("result");

let noClicks = 0;

const phrases = [
    "No",
    "Are you sure?",
    "Be serious...",
    "Please don't 😭",
    "Stop playing",
    "You doing too much",
    "This is awkward",
    "okay fine...",
    "WAIT",
    "Nah you not catching me 💀"
];

function moveNo() {
    const maxX = 250;
    const maxY = 70;

    noBtn.style.left = Math.random() * maxX + "px";
    noBtn.style.top = Math.random() * maxY + "px";
}

noBtn.addEventListener("mouseenter", moveNo);

noBtn.addEventListener("click", () => {
    noClicks++;

    // Grow YES
    yesBtn.style.transform = `scale(${1 + noClicks * .25})`;

    // Change NO text
    noBtn.textContent = phrases[Math.min(noClicks, phrases.length - 1)];

    // Shake screen after 5 clicks
    if(noClicks >= 5) {
        card.classList.add("shake");
        setTimeout(() => card.classList.remove("shake"), 300);
    }

    moveNo();
});

yesBtn.addEventListener("click", () => {
    result.style.display = "block";
    noBtn.style.display = "none";
    yesBtn.textContent = "Yesss!!! 💖";
});

</script>

</body>
</html>
